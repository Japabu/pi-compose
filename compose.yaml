# Everything running on the Pi. The Pi pulls this repo every minute and applies it (see deploy.sh).
# App images are pinned to commit tags; each app's CI bumps its tag here after a merge to main.
# Other apps (traefik + henk/memescraper/flappy) were removed
# to keep the Pi 3 light; restore them with `git revert` of the commit that removed them.
# Secrets live in .env on the Pi (not in git) — see .env.example.

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  paddibot:
    <<: *defaults
    image: ghcr.io/japabu/paddibot:sha-aa5cbe9
    container_name: paddibot
    environment:
      CLIENT_ID: "1170359617134534736"
      TOKEN: ${PADDIBOT_TOKEN:?set PADDIBOT_TOKEN in .env}

  blunderbot:
    <<: *defaults
    image: ghcr.io/japabu/blunderbot:sha-9978073
    container_name: blunderbot
    environment:
      CLIENT_ID: "1172565845839462481"
      TOKEN: ${BLUNDERBOT_TOKEN:?set BLUNDERBOT_TOKEN in .env}
      STOCKFISH_SERVER_URL: http://stockfish-server:3000
    volumes:
      - ./blunderbot-data:/app/data  # the /lichess session, so restarts keep spectating
    depends_on:
      - stockfish-server

  stockfish-server:
    <<: *defaults
    image: ghcr.io/japabu/stockfish-server:sha-18f24b7
    container_name: stockfish-server
    # The Android Stockfish build aborts under Docker's default seccomp profile (it's why this used to
    # be privileged); lifting seccomp is enough
    security_opt:
      - seccomp=unconfined
